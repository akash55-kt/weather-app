<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="d-flex justify-content-end m-2">
        <button id="themeToggle" class="btn btn-outline-dark">🌙</button>
    </div>

    <div class="container">
        <h2 class="text-center mb-4">🌦️ Weather App</h2>

        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <form class="input-group" id="form">
                    <input type="text" class="form-control" id="input" placeholder="Enter city name">
                    <button type="submit" class="btn btn-dark">Search</button>
                </form>
            </div>
        </div>

        <div class="row justify-content-center mb-5">
            <div class="col-md-6">
                <div class="card weather-card text-center shadow">
                    <div class="card-body">
                        <h4 class="card-title" id="city"></h4>
                        <h1 class="display-4" id="temp"></h1>
                        <p class="lead" id="time"></p>
                        <div class="row mt-3">
                            <div class="col" id="humidity"></div>
                            <div class="col" id="wind-speed"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5 Day Forecast -->
        <div class="container">
            <h5 class="mb-3 text-center">5-Day Forecast</h5>
            <div class="row justify-content-center" id="forecast"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
